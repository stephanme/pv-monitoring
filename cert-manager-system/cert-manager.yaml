apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: cert-manager-system
spec:
  # renovate: HelmChart
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: 1.21.3
  targetNamespace: cert-manager-system
  timeout: 10m
  failurePolicy: abort
  valuesContent: |-
    # https://artifacthub.io/packages/helm/cert-manager/cert-manager
    installCRDs: true
    # propagation-check resolvers:
    # skip /etc/resolv.conf (dnsmasq intercepts stephanme.de)
    # use Cloudflare + Quad9 explicitly
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
      - --dns01-recursive-nameservers-only=true
