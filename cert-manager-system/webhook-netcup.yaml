apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager-webhook-netcup
  namespace: cert-manager-system
spec:
  # renovate: HelmChart
  chart: oci://ghcr.io/aellwein/cert-manager-webhook-netcup/cert-manager-webhook-netcup
  version: 1.1.5
  targetNamespace: cert-manager-system
  timeout: 10m
  failurePolicy: abort
  valuesContent: |-
    groupName: com.netcup.webhook
    certManager:
      namespace: cert-manager-system
      serviceAccountName: cert-manager
