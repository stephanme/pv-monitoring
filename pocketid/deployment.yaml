kind: Deployment
apiVersion: apps/v1
metadata:
  name: pocket-id
spec:
  revisionHistoryLimit: 0
  replicas: 1
  # sqlite database on a ReadWriteOnce volume: never run two pods in parallel
  strategy:
    type: Recreate
  selector:
    matchLabels:
  template:
    metadata:
      labels:
    spec:
      securityContext:
        # distroless image runs non-root (65532) and cannot chmod its data dir itself,
        # fsGroup is what makes the mounted volume writable
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # passkeys and OIDC issuer are bound to this origin
            - name: APP_URL
              value: https://pocketid.stephanme.de
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketid-secrets
                  key: ENCRYPTION_KEY
            # reachable only through traefik, needed for client IPs in audit log and rate limits
            - name: TRUST_PROXY
              value: 'true'
            - name: ALLOW_INSECURE_CALLBACK_URLS
              value: 'false'
            - name: ANALYTICS_DISABLED
              value: 'true'
            - name: TZ
              value: Europe/Berlin
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            # metrics endpoint binds to localhost by default
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: 0.0.0.0
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: '9464'
          ports:
            - name: http
              containerPort: 1411
            - name: metrics
              containerPort: 9464
          # healthcheck subcommand works on distroless (no shell needed)
          startupProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            periodSeconds: 30
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketid-data
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 1411
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
  selector:
