apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pocketid

images:
- name: ghcr.io/pocket-id/pocket-id
  newTag: v2.19.3-distroless

labels:
  - pairs:
      app.kubernetes.io/instance: pocket-id
      app.kubernetes.io/name: pocket-id
      app.kubernetes.io/part-of: pocket-id
    includeSelectors: true

resources:
- secrets.yaml
- deployment.yaml
- monitoring.yaml
- pvc.yaml
- ingress.yaml
