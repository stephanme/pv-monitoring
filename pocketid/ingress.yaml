# Pocket ID: https on pocketid.stephanme.de only (passkeys need the https origin)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pocketid-stephanme-de
spec:
  secretName: pocketid-stephanme-de
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pocketid.stephanme.de
---
# 301 redirect http:// -> https for stephanme.de names (LAN clients)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocketid-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocketid-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pocketid.stephanme.de`)
      kind: Rule
      middlewares:
        - name: pocketid-https-redirect
      services:
        - name: pocket-id
          port: 1411
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocketid-tls
spec:
  entryPoints:
    - websecure
  routes:
    # traefik v3: Host() takes exactly one value, so one Host() per hostname
    - match: Host(`pocketid.stephanme.de`)
      kind: Rule
      services:
        - name: pocket-id
          port: 1411
  tls:
    secretName: pocketid-stephanme-de
