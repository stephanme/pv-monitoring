apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: monitoring
spec:
  # renovate: HelmChart
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.1.0
  targetNamespace: monitoring
  timeout: 10m
  failurePolicy: abort
  valuesContent: |-
    # copied from https://github.com/cablespaghetti/k3s-monitoring
    # helm upgrade --install prometheus prometheus-community/kube-prometheus-stack --values kube-prometheus-stack-values.yaml

    # references
    # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml

    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true

    # etcd monitoring. See https://github.com/cablespaghetti/k3s-monitoring/issues/4
    #
    # k3s serves its merged metrics registry on every component port (6443, 2381, 10249, 10250,
    # 10257, 10259), so every component port exposes the union of all component metrics.
    # The drop_* anchors below are per-component deny-lists: a metric family is dropped from every
    # k3s job except the job of the component that provably emits it. Families that are genuinely
    # emitted by several components (workqueue_*, rest_client_*, go_*, process_*, leaderelection_*,
    # component-base counters, k3s_*, ...) are kept on every job.
    # Verified against installed Grafana dashboards and alert/recording rules: every job-filtered
    # consumer keeps its data (e.g. scheduler recording rules use job="kube-scheduler",
    # KubeAggregatedAPIErrors/KubeClientErrors use job="apiserver", kubelet rules use job="kubelet").
    kubeEtcd:
      enabled: true
      endpoints:
      - 192.168.178.10
      - 192.168.178.11
      - 192.168.178.12
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        metricRelabelings:
          # kube-apiserver metrics - kept only in the apiserver job
          - &drop_apiserver_metrics
            action: drop
            sourceLabels: [__name__]
            regex: 'apiserver_.*'
          # unused etcd client histograms emitted by kube-apiserver - dropped everywhere (not even kept in the apiserver job)
          - &drop_unused_etcd_histograms
            action: drop
            sourceLabels: [__name__]
            regex: 'etcd_request_duration_seconds.*'
          # metrics emitted by the kube-apiserver library layers (authn/authz, aggregator, watch cache,
          # embedded etcd client, ...) - kept only in the apiserver job
          - &drop_apiserver_layer_metrics
            action: drop
            sourceLabels: [__name__]
            regex: 'aggregator_.*|authentication_.*|authorization_.*|authenticated_user_requests|session_server_.*|etcd_requests_total|etcd_bookmark_total|etcd_admission_.*|watch_cache_.*|kubernetes_feature_enabled|apiextensions_.*|field_validation_request_duration_seconds.*|node_authorizer_.*'
          # kube-scheduler metrics - kept only in the kube-scheduler job
          - &drop_scheduler_metrics
            action: drop
            sourceLabels: [__name__]
            regex: 'scheduler_.*'
          # kube-proxy metrics (kube-router is k3s' kube-proxy) - kept only in the kube-proxy job
          - &drop_kube_proxy_metrics
            action: drop
            sourceLabels: [__name__]
            regex: 'kubeproxy_.*|kube_router_.*'
          # kubelet metrics - kept only in the kubelet job
          - &drop_kubelet_metrics
            action: drop
            sourceLabels: [__name__]
            regex: 'kubelet_.*|volume_manager_.*|plugin_manager_.*|storage_operation_duration_seconds.*|csi_operations.*|volume_operation_total_seconds.*'
          # kube-controller-manager metrics - kept only in the kube-controller-manager job
          - &drop_kube_controller_manager_metrics
            action: drop
            sourceLabels: [__name__]
            regex: '(attachdetach_controller|cloud_node_lifecycle_controller|cronjob_controller|daemonset_controller|device_taint_eviction_controller|endpoint_slice_controller|endpoint_slice_mirroring_controller|ephemeral_volume_controller|garbagecollector_controller|horizontal_pod_autoscaler_controller|job_controller|node_controller|node_ipam_controller|replicaset_controller|statefulset_controller|ttl_after_finished_controller|taint_eviction_controller)_.*|pod_gc_collector_.*|pv_collector_.*|node_collector_.*|root_ca_cert_publisher_.*|clustertrustbundle_publisher_.*|retroactive_storageclass.*|force_cleaned_failed_volume_operation.*|reconstruct_volume_operation.*|storage_count_attachable_volumes_in_use|running_managed_controllers|kube_apiserver_nodeport_allocator_.*'

    # kube-apiserver metrics are scraped once, via this monitor only.
    # This job keeps apiserver_* and the apiserver-owned etcd/aggregator/authn-authz families and
    # drops everything the other k3s components emit (see drop_* anchors on kubeEtcd above).
    # etcd_request_duration_seconds_* is the biggest family in the TSDB (132k series) and is referenced by
    # no dashboard, no alert rule and no recording rule here, so it is dropped everywhere.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # chart default - must be re-declared when overriding ("drop excessively noisy apiserver buckets")
          - &drop_noisy_apiserver_buckets
            action: drop
            sourceLabels: [__name__, le]
            regex: '(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?'
          - *drop_unused_etcd_histograms
          - *drop_scheduler_metrics
          - *drop_kube_proxy_metrics
          - *drop_kubelet_metrics
          - *drop_kube_controller_manager_metrics

    # Need special config for controller, scheduler and proxy for k3s
    # https://github.com/k3s-io/k3s/issues/3619#issuecomment-973188304
    # nasbox.fritz.box = 192.168.178.10 (hacky)
    kubeControllerManager:
      enabled: true
      endpoints:
      - 192.168.178.10
      - 192.168.178.11
      - 192.168.178.12
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
        # k3s serves the merged control-plane registry on 10257 -> drop every other component's metrics
        metricRelabelings:
          - *drop_apiserver_metrics
          - *drop_unused_etcd_histograms
          - *drop_apiserver_layer_metrics
          - *drop_scheduler_metrics
          - *drop_kube_proxy_metrics
          - *drop_kubelet_metrics
    kubeScheduler:
      enabled: true
      endpoints:
      - 192.168.178.10
      - 192.168.178.11
      - 192.168.178.12
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true
        # k3s serves the merged control-plane registry on 10259 -> drop every other component's metrics
        metricRelabelings:
          - *drop_apiserver_metrics
          - *drop_unused_etcd_histograms
          - *drop_apiserver_layer_metrics
          - *drop_kube_proxy_metrics
          - *drop_kubelet_metrics
          - *drop_kube_controller_manager_metrics
    kubeProxy:
      enabled: true
      endpoints:
      - 192.168.178.10
      - 192.168.178.11
      - 192.168.178.12
      serviceMonitor:
        # k3s serves the merged control-plane registry on 10249 -> drop every other component's metrics
        # (kubeproxy_*/kube_router_* are owned here and must NOT go through drop_kube_proxy_metrics)
        metricRelabelings:
          - *drop_apiserver_metrics
          - *drop_unused_etcd_histograms
          - *drop_apiserver_layer_metrics
          - *drop_scheduler_metrics
          - *drop_kubelet_metrics
          - *drop_kube_controller_manager_metrics

    # kubelet monitoring - drop IPv6 targets (fix for non dual-stack clusters with k3s)
    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # chart default - must be re-declared when overriding (kubelet storage operation buckets)
          - action: drop
            sourceLabels: [__name__, le]
            regex: '(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?'
          # k3s serves the merged control-plane registry on 10250 -> drop every other component's metrics
          # (kubelet-owned families stay in this job)
          - *drop_apiserver_metrics
          - *drop_unused_etcd_histograms
          - *drop_apiserver_layer_metrics
          - *drop_scheduler_metrics
          - *drop_kube_proxy_metrics
          - *drop_kube_controller_manager_metrics
        # Default relabeling to preserve metrics_path label (required for upstream rules/dashboards)
        # Drop IPv6 targets - they show up=0 as kubelet doesn't listen on IPv6
        relabelings:
          - action: replace
            sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - action: drop
            sourceLabels: [__address__]
            regex: '\[.*\].*'
        cAdvisorRelabelings:
          - action: replace
            sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - action: drop
            sourceLabels: [__address__]
            regex: '\[.*\].*'
        probesRelabelings:
          - action: replace
            sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - action: drop
            sourceLabels: [__address__]
            regex: '\[.*\].*'
        resourceRelabelings:
          - action: replace
            sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - action: drop
            sourceLabels: [__address__]
            regex: '\[.*\].*'

    alertmanager:
      alertmanagerSpec:
        # see alertmanagerconfig.yml
        alertmanagerConfiguration:
          name: kube-prometheus-stack-alertmanagerconfig

        externalUrl: "http://k3s.fritz.box/alertmanager/"
        routePrefix: /alertmanager
        #    replicas: 3
        #    podAntiAffinity: "soft"
        storage:
          volumeClaimTemplate:
            metadata:
              labels:
                recurring-job.longhorn.io/source: enabled
                recurring-job-group.longhorn.io/no-backup: enabled
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: longhorn
              resources:
                requests:
                  storage: 10Mi
        resources:
          requests:
            cpu: 25m
            memory: 32Mi

    prometheus:
      ingress:
        enabled: false
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: prometheus-stripprefix@kubernetescrd
        hosts:
          - k3s.fritz.box
        paths:
          - /prometheus
        pathType: Prefix

      prometheusSpec:
        retention: 7d
        externalUrl: "http://k3s.fritz.box/prometheus/"
        enableAdminAPI: true

        #    replicas: 2
        #    podAntiAffinity: "hard"
        # nodeSelector:
        #   kubernetes.io/hostname: nasbox
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                recurring-job.longhorn.io/source: enabled
                recurring-job-group.longhorn.io/no-backup: enabled
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: longhorn
              resources:
                requests:
                  storage: 25Gi

        resources:
          requests:
            cpu: 400m
            memory: 3Gi

        # targets running outside of k3s
        additionalScrapeConfigs:
          - job_name: nibegw
            static_configs:
              - targets:
                - nibegw.fritz.box
                labels:

      # may want to replace/drop instance/pod labels for external systems
      additionalServiceMonitors:
      - name: prometheus-lt-kube-prometh-prometheus
        selector:
          matchLabels:
            app: kube-prometheus-stack-prometheus
            release: prometheus-lt
        endpoints:
          - path: /metrics
            port: http-web

    additionalPrometheusRulesMap:
      energy-rate.rules:
        groups:
          - name: energy-rate.rules
            rules:
              - record: energy_rate_kwh_cents
                expr: vector(28.01) and vector(time()) < 1767222000 # 2026-01-01
                labels:
                  type: from-grid
              - record: energy_rate_kwh_cents
                expr: vector(31.21) and vector(time()) >= 1767222000 # 2026-01-01
                labels:
                  type: from-grid
              - record: energy_rate_kwh_cents
                expr: vector(7.92)
                labels:
                  type: to-grid

      prometheus-node-exporter.rules:
        groups:
          - name: node-exporter-lt.rules
            rules:
              - record: instance:node_memory_MemAvailable_bytes:avg15m
                expr: avg_over_time(node_memory_MemAvailable_bytes[15m])
      
      nibe.rules:
        groups:
          - name: nibe-energy.rules
            interval: 30s
            rules:
              # nibe_pv = pv - home | truncated to [0, min(nibe,pv)]
              # car_pv = pv - home - nibe | truncated to [0, car]  # implemented in pv-control where home includes nibe
              # home=home_total - nibe - car
              #
              # nibe_pv = pv - (home_total - nibe - car) = pv - home_total + nibe + car | truncated to [0, min(nibe,pv)]
              # nibe_grid = nibe - nibe_pv
              - record: source:nibe_energy_meter_wh:rate
                expr: clamp(max(rate(kpc_home_power_consumption_wh_total{source="pv"}[5m])) - max(rate(kpc_home_power_consumption_total_wh_total[5m])) + max(rate(nibe_energy_meter_wh_total[5m])) + max(rate(pvcontrol:total_charged_energy_wh_total[5m])), 0, scalar(min(rate(nibe_energy_meter_wh_total[5m]) or rate(kpc_home_power_consumption_wh_total{source="pv"}[5m]))))
                labels:
                  source: pv
              - record: source:nibe_energy_meter_wh:rate
                expr: max(rate(nibe_energy_meter_wh_total[5m])) - max(source:nibe_energy_meter_wh:rate{source="pv"})
                labels:
                  source: grid
              - record: source:nibe_energy_meter_wh_total
                expr: (source:nibe_energy_meter_wh_total >= 0 or clamp_max(source:nibe_energy_meter_wh:rate, 0)) + source:nibe_energy_meter_wh:rate * 30
              # use temporarily for correcting values in case of trouble, delete broken time-range
              # - record: source:nibe_energy_meter_wh_total
              #   expr: "19900"
              #   labels:
              #     source: pv
              # - record: source:nibe_energy_meter_wh_total
              #   expr: "35003"
              #   labels:
              #     source: grid

    grafana:
      admin:
        existingSecret: kube-prometheus-stack
        userKey: grafana-admin-user
        passwordKey: grafana-admin-password

      plugins:
        - grafana-piechart-panel
        - flant-statusmap-panel
      grafana.ini:
        server:
          domain: k3s.fritz.box
          root_url: "%(protocol)s://%(domain)s/grafana"
          serve_from_sub_path: true
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Viewer
      ingress:
        enabled: false
        hosts:
          - k3s.fritz.box
        path: /grafana

      additionalDataSources:
        # prometheus-lt instances deployed separately
        - name: prometheus-lt
          type: prometheus
          url: http://prometheus-lt-kube-prometh-prometheus:9090/
          access: proxy
          jsonData:
            timeInterval: 15m
      resources:
        requests:
          cpu: 25m
          memory: 400Mi
      sidecar:
        dashboards:
          searchNamespace: ALL
        datasources:
          # https://github.com/prometheus-community/helm-charts/issues/5232
          # https://github.com/grafana/helm-charts/issues/4023
          watchMethod: "SLEEP" 
        resources:
          requests:
            cpu: 5m
            memory: 64Mi
      # fix for https://github.com/prometheus-community/helm-charts/issues/1867 - missing release label on grafana service monitor
      serviceMonitor:
        labels:
          release: prometheus

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
