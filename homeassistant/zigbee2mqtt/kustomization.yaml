apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homeassistant

images:
- name: koenkk/zigbee2mqtt
  newTag: "2.14.3"

# ckware/ti-cc-tool (zigbee firmware job) is intentionally not listed: it is
# deployed untagged (:latest) and is not meant to be pinned

resources:
- deployment.yaml
- ingress.yaml
# suspended job, only used to flash the zigbee coordinator (see the file)
- zigbee-firmware.yaml
