---
# zigbee2mqtt UI is served under homeassistant.fritz.box/zigbee2mqtt/ (no own hostname)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zigbee2mqtt
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`homeassistant.fritz.box`) && PathPrefix(`/zigbee2mqtt/`)
    middlewares:
    - name: zigbee2mqtt-stripprefix
    services:
    - name: zigbee2mqtt
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zigbee2mqtt-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /zigbee2mqtt/
