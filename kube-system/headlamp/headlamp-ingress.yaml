# http://headlamp.fritz.box
# http://headlamp.stephanme.de -> redirect to https
# https://headlamp.stephanme.de - with OIDC login
---
# plain http LAN route (token paste login, never redirected)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-http
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headlamp.fritz.box`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
---
# 301 redirect http:// -> https for the stephanme.de name (LAN clients)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: headlamp-https-redirect
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-http-redirect
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headlamp.stephanme.de`)
      kind: Rule
      middlewares:
        - name: headlamp-https-redirect
      services:
        - name: headlamp
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-tls
  namespace: kube-system
  labels:
    app.kubernetes.io/name: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    # traefik v3: Host() takes exactly one value, so one Host() per hostname
    - match: Host(`headlamp.stephanme.de`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls:
    secretName: kube-system-stephanme-de
