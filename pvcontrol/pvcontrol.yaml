apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvcontrol-deployment
  namespace: pvcontrol
spec:
  selector:
    matchLabels:
      app: pvcontrol
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pvcontrol
    spec:
      containers:
        - name: pvcontrol
          image: ghcr.io/stephanme/pv-control:latest
          command:
            - python
            - -m
            - pvcontrol
            - --meter
            - KostalMeter
            - --wallbox
            - GoeWallbox
            - --relay
            - RaspiPhaseRelay
            - --car
            - SkodaCar
            - --mqtt
            - --config
            - |-
              {
                "meter": {
                  "host": "scb.fritz.box",
                  "port": 1502,
                  "unit_id": 71
                },
                "wallbox": {
                  "url": "http://go-echarger.fritz.box"
                },
                "relay": {
                  "enable_phase_switching": true,
                  "installed_on_host": "pi1",
                  "phase_relay_type": "NO"
                },
                "controller": {
                  "enable_auto_phase_switching": false,
                  "pv_allow_charging_delay": 300
                },
                "car": {
                  "disabled": false,
                  "api_key": "$(car_api_key)",
                  "vin": "$(car_vin)"
                },
                "mqtt": {
                  "broker": "mosquitto.homeassistant.svc.cluster.local",
                  "username": "$(mqtt_user)",
                  "password": "$(mqtt_password)"
                }
              }
            - --hostname
            - $(node_name)
          env:
            - name: car_api_key
              valueFrom:
                secretKeyRef:
                  name: pvcontrol
                  key: car_api_key
            - name: car_vin
              valueFrom:
                secretKeyRef:
                  name: pvcontrol
                  key: car_vin
            - name: node_name
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName              
            - name: mqtt_user
              valueFrom:
                secretKeyRef:
                  name: pvcontrol
                  key: mqtt_user
            - name: mqtt_password
              valueFrom:
                secretKeyRef:
                  name: pvcontrol
                  key: mqtt_password
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
          lifecycle:
            preStop:
              exec:
                # SIGINT needed for flask dev server, kill is a bash built-in
                command: ["bash", "-c", "kill -s SIGINT 1"]
      # prefer pi1 - needs descheduler migrate pvcontrol to pi1 after a pi1 downtime
      affinity:
        nodeAffinity:      
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - pi1

---
apiVersion: v1
kind: Service
metadata:
  name: pvcontrol-service
  namespace: pvcontrol
  labels:
    app: pvcontrol
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: tcp
  selector:
    app: pvcontrol
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pvcontrol-ingress
  namespace: pvcontrol
spec:
  entryPoints:
    - web
  routes:
  - kind: Rule
    match: Host(`pvcontrol.fritz.box`)
    middlewares:
    - name: pvcontrol-compress
    services:
    - name: pvcontrol-service
      port: 8080
  # deprecated -> redirect
  - kind: Rule
    match: Path(`/pvcontrol`) || PathPrefix(`/pvcontrol/`)
    middlewares:
    - name: pvcontrol-redirect
    services:
    - name: pvcontrol-service
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pvcontrol-redirect
  namespace: pvcontrol
spec:
  redirectRegex:
    regex: .*
    replacement: http://pvcontrol.fritz.box
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pvcontrol-compress
  namespace: pvcontrol
spec:
  compress:
    minResponseBodyBytes: 2048
    excludedContentTypes:
      - font/woff2
      - font/woff
      - image/jpeg
      - image/png
      - image/vnd.microsoft.icon
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: prometheus
  name: pvcontrol
  namespace: pvcontrol
spec:
  endpoints:
  - path: /metrics
    port: tcp
  selector:
    matchLabels:
      app: pvcontrol
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    release: prometheus
  name: pvcontrol
  namespace: pvcontrol
spec:
  groups:
  - name: pv-control.rules
    rules:
    - expr: max(pvcontrol_controller_total_charged_energy_wh_total) by (job)
      record: pvcontrol:total_charged_energy_wh_total
    - expr: max(pvcontrol_controller_charged_energy_wh_total) by (job, source)
      record: pvcontrol:charged_energy_wh_total
    # Alert when the Skoda API key expires in less than 2 weeks.
    # After a pvcontrol restart the metric reports -1 (unknown) until the first
    # Skoda API request; a short -1 is ignored by the long "for" period, while a
    # permanent -1 (e.g. bad API key) correctly alerts after 6h.
    - alert: PvControlCarApiKeyExpiring
      expr: pvcontrol_car_api_key_remaining_lifetime_seconds < (14 * 24 * 3600)
      for: 6h
      labels:
        severity: warning
      annotations:
        summary: "Skoda API key for pvcontrol expires in less than 2 weeks"
        description: "The pvcontrol Skoda car API key expires in less than 2 weeks. Renew the key in the Skoda app and update the pvcontrol secret before it expires, otherwise car integration stops working."
