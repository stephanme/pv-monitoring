# Homepage: http on k3s.fritz.box, https on stephanme.de and home.stephanme.de
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`k3s.fritz.box`) && (Path(`/`) || PathPrefix(`/homepage/`))
    services:
    - name: homepage
      port: 80
---
# HTTPS serving of the homepage on stephanme.de and home.stephanme.de
# One certificate for both names (single DNS-01 round). The apex is solvable by
# the netcup webhook: _acme-challenge.stephanme.de -> scope "@" in the zone.
# name/secretName intentionally keep the old home-stephanme-de name: renaming
# would leave the old Certificate behind (kubectl apply -k does not prune).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-stephanme-de
spec:
  secretName: home-stephanme-de
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - stephanme.de
    - home.stephanme.de
---
# 301 redirect http:// -> https for both stephanme.de names (LAN clients)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`stephanme.de`) || Host(`home.stephanme.de`)
      kind: Rule
      middlewares:
        - name: homepage-https-redirect
      services:
        - name: homepage
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-tls
spec:
  entryPoints:
    - websecure
  routes:
    # traefik v3: Host() takes exactly one value, so one Host() per hostname
    - match: (Host(`stephanme.de`) || Host(`home.stephanme.de`)) && (Path(`/`) || PathPrefix(`/homepage/`))
      kind: Rule
      services:
        - name: homepage
          port: 80
  tls:
    secretName: home-stephanme-de
