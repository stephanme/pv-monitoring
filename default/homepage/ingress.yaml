# HTTP serving of the homepage on k3s.fritz.box
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
spec:
  entryPoints:
  - web
  routes:
  - kind: Rule
    match: Host(`k3s.fritz.box`) && (Path(`/`) || PathPrefix(`/homepage/`))
    services:
    - name: homepage
      port: 80
---
# HTTPS serving of the homepage on home.stephanme.de
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-stephanme-de
spec:
  secretName: home-stephanme-de
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - home.stephanme.de
---
# 301 redirect http://home.stephanme.de -> https (LAN clients)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-http-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`home.stephanme.de`)
      kind: Rule
      middlewares:
        - name: homepage-https-redirect
      services:
        - name: homepage
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-tls
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.stephanme.de`) && (Path(`/`) || PathPrefix(`/homepage/`))
      kind: Rule
      services:
        - name: homepage
          port: 80
  tls:
    secretName: home-stephanme-de
