apiVersion: batch/v1
kind: CronJob
metadata:
  name: regsync
  namespace: zot
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Replace
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400  # 4h
      template:
        spec:
          containers:
            - name: regsync
              image: ghcr.io/stephanme/toolbox
              command:
              - /bin/sh
              - -c
              - |
                set -e
                regsynccmd=once  # check|once
                
                START_TS=$(date +%s)
                echo "start: $(date -u +%FT%TZ)"
                FIXEDIDX=""  # index manifests created in this run
                # summary is logged at the end of the run, built from /regsync.log
                summary() {
                  rc=$?
                  sleep 1  # give tee time to flush /regsync.log
                  echo
                  echo "==================== regsync summary ===================="
                  echo "duration: $(( $(date +%s) - START_TS ))s"
                  jq -Rsr '
                    def lvl: ((.level // "") | ascii_upcase);
                    def bad: lvl == "ERROR" or lvl == "FATAL" or (.msg | test("^Failed"));
                    def warn: lvl == "WARN" or lvl == "WARNING";
                    def subj: (.target // .ref // .source // "?");
                    def detail(p): "  " + p + " " + subj + ": " + .msg + (if .error then " (" + .error + ")" else "" end);
                    def section($items; $title):
                      ($items | length) as $n
                      | ($title + ($n | tostring) + "\n")
                        + (if $n == 0 then "" else ($items | .[0:25] | join("\n")) + "\n" end)
                        + (if $n > 25 then "  ... and " + (($n - 25) | tostring) + " more\n" else "" end);
                    [ splits("\n") | fromjson? | select(.msg) ] as $e
                    | ($e | map(select(bad) | subj)) as $failed
                    | ($e | map(select(.msg == "Image sync needed" and .target))
                          | map(select(.target as $t | ($failed | index($t)) | not))
                          | map("  + " + .target + "  <-  " + (.source // "?")) | unique) as $updated
                    | ($e | map(select(.msg == "Image refreshing" and .target) | "  ~ " + .target) | unique) as $refreshed
                    | ($e | map(select(.msg == "Skipping unsupported media type") | detail(">")) | unique) as $skipped
                    | ($e | map(select(bad) | detail("!")) | unique) as $errors
                    | ($e | map(select(warn) | detail("-")) | unique) as $warnings
                    | (section($updated; "images updated: ")
                      + (if ($refreshed | length) > 0 then section($refreshed; "images refreshed: ") else "" end)
                      + (if ($skipped | length) > 0 then section($skipped; "images skipped: ") else "" end)
                      + section($errors; "errors: ")
                      + (if ($warnings | length) > 0 then section($warnings; "warnings: ") else "" end)
                      + "log entries: " + ($e | length | tostring))
                  ' /regsync.log || echo "  no regsync log entries in /regsync.log"
                  if [ -n "$FIXEDIDX" ]; then
                    set -- $FIXEDIDX
                    echo "index manifests created: $#"
                    for t in $FIXEDIDX; do echo "  # $t"; done
                  else
                    echo "index manifests created: 0"
                  fi
                  echo "exit code: $rc"
                  echo "========================================================="
                }
                trap summary EXIT
                echo regsync ${regsynccmd}
                regsync ${regsynccmd} --config /etc/regsync/config.yaml --logopt json 2> >(tee -a /regsync.log >&2) || true
                FIXIDX=$(cat /regsync.log | grep -e '^{"time":' | jq -rs '[.[]|select(.msg=="Image sync needed" and (.target|test("/stephanme/")|not))|.target]|join(" ")')
                regctl registry set --tls=disabled registry.fritz.box
                echo "Fix missing index manifests"
                for target in $FIXIDX; do
                  set +e 
                  regctl manifest head $target >/dev/null 2>/dev/null
                  if [ $? -ne 0 ]; then
                    # some targets have special platform support, see config.yaml
                    if [[ "$target" == *ghcr.io/immich-app/immich-server* ]]; then
                      platforms='--platform linux/arm64'
                    else
                      platforms='--platform linux/amd64 --platform linux/arm64 --platform unknown/unknown'
                    fi
                    echo regctl index create $target $platforms --ref ${target:19}
                    if [ "$regsynccmd" = "once" ]; then
                      set -e
                      regctl index create $target $platforms --ref ${target:19}
                      FIXEDIDX="${FIXEDIDX} ${target}"
                    fi
                  fi
                done
              volumeMounts:
                - mountPath: "/etc/regsync"
                  name: regsync-config
              envFrom:
                - secretRef:
                    name: regsync-secrets
              env:
                - name: GODEBUG
                  value: "http2client=0"
          restartPolicy: Never
          volumes:
            - name: regsync-config
              configMap:
                name: regsync-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: regsync-latest
  namespace: zot
spec:
  # Manual trigger only (runs only on Jan 1st at midnight)
  schedule: "0 0 1 1 *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Replace
  suspend: true
  jobTemplate:
    spec:
      activeDeadlineSeconds: 14400  # 4h
      template:
        spec:
          containers:
            - name: regsync-latest
              image: ghcr.io/stephanme/toolbox
              command:
              - /bin/sh
              - -c
              - |
                set -e
                date
                regsynccmd=once
                echo regsync ${regsynccmd}
                regsync ${regsynccmd} --config /etc/regsync/config-latest.yaml --logopt json || true
              volumeMounts:
                - mountPath: "/etc/regsync"
                  name: regsync-config-latest
              envFrom:
                - secretRef:
                    name: regsync-secrets
              env:
                - name: GODEBUG
                  value: "http2client=0"
          restartPolicy: Never
          volumes:
            - name: regsync-config-latest
              configMap:
                name: regsync-config-latest
